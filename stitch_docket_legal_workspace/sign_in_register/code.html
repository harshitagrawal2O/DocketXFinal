<body class="flex items-center justify-center min-h-screen p-stack-md font-body-md text-on-surface">
<!-- Auth Container -->

<!-- Left Panel: Editorial Panel -->
<section class="hidden md:flex flex-col justify-between w-[45%] bg-primary-container p-margin-page relative overflow-hidden">
<!-- Seal Watermark -->

</div>
<div class="relative z-10">
<div class="text-white">

</div>
</div>
<div class="relative z-10 max-w-xs">
<h1 class="font-headline-lg text-headline-lg text-white mb-stack-sm leading-tight">

</div>
<div class="relative z-10">
<p class="font-label-sm text-label-sm text-on-primary-container uppercase tracking-widest">

</div>
</section>
<!-- Right Panel: Auth Controls -->
<section class="flex-1 bg-surface-container-lowest flex flex-col justify-between p-margin-page relative">
<div class="w-full max-w-sm mx-auto flex flex-col flex-grow justify-center">
<!-- Toggle Tab -->
<div class="flex bg-surface-container-low p-1 rounded-lg mb-stack-lg">
<button class="flex-1 py-2 font-label-md text-label-md rounded tab-transition bg-white text-primary shadow-sm" id="toggle-signin" onclick="switchAuth('signin')">
                        Sign in
                    </button>
<button class="flex-1 py-2 font-label-md text-label-md rounded tab-transition text-on-surface-variant hover:text-primary" id="toggle-signup" onclick="switchAuth('signup')">
                        Create account
                    </button>
</div>
<div class="space-y-stack-md">
<!-- Form Content -->
<form class="space-y-stack-md" id="auth-form" onsubmit="event.preventDefault();">
<!-- Name Field (Hidden by default for Sign In) -->
<div class="hidden transition-all duration-300" id="name-field">
<label class="block font-label-md text-label-md text-on-surface-variant mb-1 uppercase tracking-wider">Full Name</label>
<input class="w-full border-b border-outline-variant bg-transparent py-2 focus:border-secondary outline-none transition-colors font-body-md placeholder:text-outline/50" placeholder="Adv. Rajesh Khanna" type="text"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1 uppercase tracking-wider">Email Address</label>
<input class="w-full border-b border-outline-variant bg-transparent py-2 focus:border-secondary outline-none transition-colors font-body-md placeholder:text-outline/50" placeholder="counsel@chambers.in" type="email"/>
</div>
<div>
<div class="flex justify-between items-center mb-1">
<label class="block font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Password</label>

</div>

</main>
<script>
        function switchAuth(mode) {
            const toggleSignIn = document.getElementById('toggle-signin');
            const toggleSignUp = document.getElementById('toggle-signup');
            const nameField = document.getElementById('name-field');
            const submitBtn = document.getElementById('submit-btn');
            const forgotLink = document.getElementById('forgot-link');

            if (mode === 'signup') {
                // UI States
                toggleSignUp.classList.add('bg-white', 'text-primary', 'shadow-sm');
                toggleSignUp.classList.remove('text-on-surface-variant');
                
                toggleSignIn.classList.remove('bg-white', 'text-primary', 'shadow-sm');
                toggleSignIn.classList.add('text-on-surface-variant');

                // Form States
                nameField.classList.remove('hidden');
                submitBtn.innerText = 'Create Account';
                forgotLink.classList.add('invisible');
            } else {
                // UI States
                toggleSignIn.classList.add('bg-white', 'text-primary', 'shadow-sm');
                toggleSignIn.classList.remove('text-on-surface-variant');
                
                toggleSignUp.classList.remove('bg-white', 'text-primary', 'shadow-sm');
                toggleSignUp.classList.add('text-on-surface-variant');

                // Form States
                nameField.classList.add('hidden');
                submitBtn.innerText = 'Sign In';
                forgotLink.classList.remove('invisible');
            }
        }

        // Micro-interaction: Input field focus effects
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label').classList.add('text-secondary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label').classList.remove('text-secondary');
            });
        });
    </script>
